name: verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check source and rebuild the bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Static consistency checks
        run: python3 tools/verify.py

      - name: Rebuild the single-file bundle
        run: python3 tools/bundle.py

      - name: Fail if dist/ is not in sync with site/
        # Builds are deterministic (uuid5 over asset paths), so a dirty tree here
        # means someone edited site/ without committing the rebuilt bundle.
        run: |
          if ! git diff --quiet -- dist/rashfa-cafe-menu.html; then
            echo "::error::dist/rashfa-cafe-menu.html is stale — run: python3 tools/bundle.py"
            git diff --stat -- dist/rashfa-cafe-menu.html
            exit 1
          fi
          echo "dist/ matches site/"

      - name: Confirm the bundle is self-contained
        run: |
          test -s dist/rashfa-cafe-menu.html
          # No local paths may survive into the bundle — they would 404 offline.
          if grep -qE '(src|href)="(img|js|css)/' dist/rashfa-cafe-menu.html; then
            echo "::error::unpacked local references remain in the bundle"
            exit 1
          fi
          echo "bundle carries its own assets"

  deploy:
    name: Publish site/ to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          # site/ is the readable source and deploys directly — no build step,
          # which is the point of having the source be plain files.
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
